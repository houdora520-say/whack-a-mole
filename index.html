<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛打地鼠遊戲 🔨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔨 打地鼠大作戰 🔨</h1>
            <p class="subtitle">趕快敲打所有出現的地鼠吧！</p>
        </header>

        <div class="game-info">
            <div class="info-item">
                <span class="label">分數:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="info-item">
                <span class="label">時間:</span>
                <span id="timer" class="value">30</span>s
            </div>
            <div class="info-item">
                <span class="label">難度:</span>
                <span id="difficulty" class="value">簡單</span>
            </div>
        </div>

        <div class="difficulty-selector">
            <button class="difficulty-btn active" data-difficulty="easy">簡單</button>
            <button class="difficulty-btn" data-difficulty="medium">中等</button>
            <button class="difficulty-btn" data-difficulty="hard">困難</button>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- 遊戲格子將由 JavaScript 動態生成 -->
        </div>

        <div class="button-container">
            <button id="startBtn" class="btn btn-primary">🎮 開始遊戲</button>
            <button id="resetBtn" class="btn btn-secondary" disabled>🔄 重新開始</button>
        </div>

        <div class="game-over-modal" id="gameOverModal" style="display: none;">
            <div class="modal-content">
                <h2>遊戲結束！</h2>
                <p class="final-score">最終分數: <span id="finalScore">0</span></p>
                <p class="game-message" id="gameMessage"></p>
                <button class="btn btn-primary" onclick="location.reload()">🎮 再玩一次</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
